 height="46.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="310.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Grade documents</text><text x="310.0" y="206.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">gemma3:1b binary yes / no</text><rect x="150.0" y="240.0" width="320.0" height="46.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="310.0" y="258.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Decompose into 2–3 sub-questions</text><text x="310.0" y="274.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">llama3:8b</text><rect x="150.0" y="308.0" width="320.0" height="46.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4" rx="6"/><text x="310.0" y="326.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Retrieve fresh documents per sub-question</text><text x="310.0" y="342.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">new in v2  ·  then de-duplicate</text><rect x="150.0" y="376.0" width="320.0" height="46.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="310.0" y="394.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Union of sub-question contexts</text><text x="310.0" y="410.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">de-duplicated</text><rect x="150.0" y="444.0" width="320.0" height="46.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="310.0" y="462.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Answer each sub-question</text><text x="310.0" y="478.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">llama3:8b</text><rect x="150.0" y="512.0" width="320.0" height="46.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="310.0" y="530.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Synthesize final answer</text><text x="310.0" y="546.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">no word cap</text><rect x="150.0" y="580.0" width="320.0" height="46.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="310.0" y="598.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Grade answer (usefulness)</text><text x="310.0" y="614.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">gemma3:1b</text><rect x="150.0" y="648.0" width="320.0" height="32.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="310.0" y="668.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Answer</text><line x1="470.0" y1="603.0" x2="504.0" y2="603.0" stroke="#666666" stroke-width="1.3" stroke-dasharray="4,3"/><line x1="504.0" y1="603.0" x2="504.0" y2="467.0" stroke="#666666" stroke-width="1.3" stroke-dasharray="4,3"/><line x1="504.0" y1="467.0" x2="476.0" y2="467.0" stroke="#666666" stroke-width="1.3" stroke-dasharray="4,3"/><path d="M476.0 463.0 L476.0 471.0 L470.0 467.0 Z" fill="#666666"/><text x="509.0" y="535.0" font-size="9" text-anchor="start" fill="#666666" font-weight="400" transform="rotate(0 509 535.0)">retry ≤ 2</text><text x="20.0" y="722.0" font-size="10" text-anchor="start" fill="#666666" font-weight="400">Per-sub-question retrieval widens the context with off-topic chunks, lowering precision.</text></svg>
