<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" font-family="-apple-system,BHF,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="760" height="760" fill="white"/>
<text x="380.0" y="28.0" font-size="16" text-anchor="middle" fill="#222222" font-weight="600">Advanced v3 (rerank-aware), as built</text>
<rect x="200.0" y="50.0" width="320.0" height="32.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="360.0" y="70.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Query</text><line x1="360.0" y1="82.0" x2="360.0" y2="102.0" stroke="#999999" stroke-width="1.5"/><path d="M356.0 102.0 L364.0 102.0 L360.0 108.0 Z" fill="#999999"/><rect x="200.0" y="108.0" width="320.0" height="46.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="360.0" y="126.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Retrieve wide  (top-20)</text><text x="360.0" y="142.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">dense or hybrid (BM25 + dense, RRF)</text><line x1="360.0" y1="154.0" x2="360.0" y2="186.0" stroke="#999999" stroke-width="1.5"/><path d="M356.0 186.0 L364.0 186.0 L360.0 192.0 Z" fill="#999999"/><rect x="200.0" y="192.0" width="320.0" height="46.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4" rx="6"/><text x="360.0" y="210.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Rerank + score-grade  (T2.3)</text><text x="360.0" y="226.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">cross-encoder (bge); keep score ≥ threshold</text><line x1="360.0" y1="238.0" x2="360.0" y2="274.0" stroke="#999999" stroke-width="1.5"/><path d="M356.0 274.0 L364.0 274.0 L360.0 280.0 Z" fill="#999999"/><rect x="150.0" y="280.0" width="420.0" height="48.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4" rx="6"/><text x="360.0" y="298.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Adaptive route  (T2.5)</text><text x="360.0" y="314.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">single-hop if top-1 score ≥ 0.7 and margin ≥ 0, else multi-hop</text><line x1="290.0" y1="328.0" x2="190.0" y2="392.0" stroke="#999999" stroke-width="1.5"/><path d="M197.8 391.2 L194.0 385.3 L190.0 392.0 Z" fill="#999999"/><text x="240.0" y="355.0" font-size="9" text-anchor="middle" fill="#666666" font-weight="400">single-hop</text><line x1="430.0" y1="328.0" x2="545.0" y2="392.0" stroke="#999999" stroke-width="1.5"/><path d="M540.6 385.5 L537.2 391.7 L545.0 392.0 Z" fill="#999999"/><text x="487.5" y="355.0" font-size="9" text-anchor="middle" fill="#666666" font-weight="400">multi-hop</text><rect x="75.0" y="392.0" width="230.0" height="48.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="190.0" y="410.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Answer directly</text><text x="190.0" y="426.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">from the reranked top-4</text><rect x="405.0" y="392.0" width="280.0" height="46.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="545.0" y="410.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Decompose + retrieve per sub-question</text><text x="545.0" y="426.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">then de-duplicate the union</text><line x1="545.0" y1="438.0" x2="545.0" y2="464.0" stroke="#999999" stroke-width="1.5"/><path d="M541.0 464.0 L549.0 464.0 L545.0 470.0 Z" fill="#999999"/><rect x="405.0" y="470.0" width="280.0" height="48.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4" rx="6"/><text x="545.0" y="488.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Rerank union vs the original query  (T2.4)</text><text x="545.0" y="504.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">keep top-6</text><line x1="545.0" y1="518.0" x2="545.0" y2="544.0" stroke="#999999" stroke-width="1.5"/><path d="M541.0 544.0 L549.0 544.0 L545.0 550.0 Z" fill="#999999"/><rect x="405.0" y="550.0" width="280.0" height="48.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4" rx="6"/><text x="545.0" y="568.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Synthesize from reranked context (T3.7)</text><text x="545.0" y="584.0" font-size="9.5" text-anchor="middle" fill="#666666" font-weight="400">context + sub-answers; no word cap</text><line x1="190.0" y1="440.0" x2="320.0" y2="632.0" stroke="#999999" stroke-width="1.5"/><path d="M319.0 624.2 L313.2 628.2 L320.0 632.0 Z" fill="#999999"/><line x1="545.0" y1="598.0" x2="400.0" y2="632.0" stroke="#999999" stroke-width="1.5"/><path d="M407.6 633.8 L406.0 627.0 L400.0 632.0 Z" fill="#999999"/><rect x="240.0" y="632.0" width="240.0" height="32.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="360.0" y="652.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Grade answer (usefulness)</text><line x1="360.0" y1="664.0" x2="360.0" y2="688.0" stroke="#999999" stroke-width="1.5"/><path d="M356.0 688.0 L364.0 688.0 L360.0 694.0 Z" fill="#999999"/><rect x="240.0" y="694.0" width="240.0" height="32.0" fill="#ffffff" stroke="#222222" stroke-width="1.4" rx="6"/><text x="360.0" y="714.0" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="600">Answer</text><line x1="480.0" y1="648.0" x2="707.0" y2="648.0" stroke="#666666" stroke-width="1.3" stroke-dasharray="4,3"/><line x1="707.0" y1="648.0" x2="707.0" y2="415.0" stroke="#666666" stroke-width="1.3" stroke-dasharray="4,3"/><line x1="707.0" y1="415.0" x2="691.0" y2="415.0" stroke="#666666" stroke-width="1.3" stroke-dasharray="4,3"/><path d="M691.0 411.0 L691.0 419.0 L685.0 415.0 Z" fill="#666666"/><text x="711.0" y="540.0" font-size="9" text-anchor="start" fill="#666666" font-weight="400">retry ≤ 2</text><text x="20.0" y="748.0" font-size="10" text-anchor="start" fill="#666666" font-weight="400">Blue = the four rerank-aware fixes (T2.3 grader, T2.5 routing, T2.4 union-rerank, T3.7 synthesis). Without a reranker the pipeline falls back to v2.</text></svg>
